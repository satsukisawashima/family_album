<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Album</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main>
    <section class="wrap post-section">
      <form id="postForm" class="post-form">
        <fieldset>
          <legend>投稿フォーム</legend>
          <div class="form-grid">
            <div>
              <label for="photoInput">写真を選択</label>
              <input type="file" id="photoInput" name="photos" accept="image/*" multiple required />
              <p class="hint">最大5枚まで選択できます。</p>
            </div>

            <div>
              <label for="captionInput">コメント（任意）</label>
              <textarea id="captionInput" name="caption" rows="4" placeholder="今日はどんなことがあった？"></textarea>
              <p class="hint">コメントなしでも、犬の気持ちが自動で生成されます。</p>
            </div>
          </div>
          <button type="submit">投稿する</button>
        </fieldset>
      </form>

      <div id="preview" class="preview hidden" aria-live="polite">
        <div class="preview-header">
          <h2>投稿プレビュー</h2>
          <p id="previewCaption" class="preview-caption"></p>
        </div>
        <div id="previewGrid" class="photo-grid"></div>
        <div class="preview-body">
          <p id="previewMood" class="preview-mood"></p>
          <p id="previewStory" class="preview-story"></p>
        </div>
      </div>
    </section>

    <section class="wrap album-list">
      <div id="postList" class="post-list"></div>
    </section>
  </main>

  <script src="assets/js/app.js"></script>
      </ol>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Node.js不要・ビルドツール不使用の静的サイト構成。</p>
    </div>
  </footer>
</body>
</html>
